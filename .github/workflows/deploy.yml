# Push to main = CI tests only. Production deploy is Mark-gated locally (GitBot).
# No Cloudflare secrets required on this repo.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx wrangler types
      - run: npx tsc -p .
      - run: npm test
